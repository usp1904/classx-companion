<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ClassX Companion — Viz</title>
    <style>
:root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

        /* Eye-comfort neon palette (soft, low-bloom, anti-glare) */
        --bg0: #f7f9ff;
        --bg1: #eef3ff;
        --panel: rgba(255, 255, 255, 0.78);
        --panelSolid: #ffffff;
        --stroke: rgba(17, 24, 39, 0.10);
        --stroke2: rgba(17, 24, 39, 0.14);
        --text: #0f172a;
        --muted: #475569;
        --muted2: #64748b;

        /* Soft neon accents */
        --neonA: #2dd4ff; /* cyan */
        --neonB: #60a5fa; /* blue */
        --neonC: #a78bfa; /* violet */
        --neonD: #34d399; /* green */
        --danger: #ef4444;

        --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        --shadow2: 0 10px 24px rgba(15, 23, 42, 0.08);

        /* Reduced-glare “screen” style */
        --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.50));
        --glareMask: radial-gradient(1200px 600px at 20% 0%, rgba(45, 212, 255, 0.14), transparent 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(167, 139, 250, 0.14), transparent 55%);

        --focus: rgba(45, 212, 255, 0.35);

        background: var(--bg0);
        color: var(--text);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg1);
        background-image: var(--glareMask);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body { width: 100%; }
      #root { width: 100%; max-width: 1440px; margin: 0 auto; padding: 24px; }
      button { border: none; cursor: pointer; font-family: inherit; }

      /* Global “anti glare” overlay for smoother perception */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.12));
        mix-blend-mode: soft-light;
        opacity: 0.55;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .app-shell { display: flex; flex-direction: column; gap: 24px; }
.app-header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-start;
        padding: 24px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(17, 34, 64, 0.92));
        border: 1px solid rgba(255, 255, 255, 0.10);
        color: #f8fafc;
        box-shadow: var(--shadow2);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: radial-gradient(140% 140% at 10% 10%, rgba(45, 212, 255, 0.95), rgba(96, 165, 250, 0.80) 45%, rgba(167, 139, 250, 0.72) 100%);
        font-weight: 800;
        color: #ffffff;
        font-size: 22px;
        box-shadow: 0 18px 40px rgba(37, 99, 235, 0.22);
      }
      .brand-copy h1 { margin: 0 0 6px 0; font-size: 28px; }
      .brand-copy p { margin: 0; opacity: 0.85; font-size: 14px; max-width: 520px; }
      .header-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .status-badge { padding: 10px 16px; border-radius: 999px; font-weight: 700; letter-spacing: 0.02em; }
      .status-badge.success { background: #1f7a17; color: #f8fafc; }
      .status-badge.danger { background: #dc2626; color: #fff; }
      .meta-note { color: #cbd5e1; font-size: 13px; }
      .layout-grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
      .main-nav { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 22px 50px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; gap: 24px; }
      .main-nav h2 { margin: 0 0 8px; font-size: 18px; letter-spacing: 0.01em; color: #0f172a; }
      .nav-item { width: 100%; text-align: left; padding: 14px 18px; border-radius: 16px; background: #f8fafc; color: #0f172a; font-weight: 600; transition: background 0.2s ease; }
      .nav-item:hover { background: #e2e8f0; }
      .nav-item.active { background: #1d4ed8; color: white; }
      .nav-footer { color: #64748b; font-size: 13px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
      .main-panel { display: flex; flex-direction: column; gap: 20px; }
      .panel-card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }
      .panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
      .panel-header h2 { margin: 0 0 8px; font-size: 24px; }
      .panel-header p { margin: 0; color: #475569; line-height: 1.6; }
      .hero-actions, .action-row { display: flex; flex-wrap: wrap; gap: 12px; }
      .primary-button, .secondary-button, .list-button, .pill-button { font-size: 14px; border-radius: 14px; padding: 12px 18px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
      .primary-button { background: #2563eb; color: white; box-shadow: 0 16px 30px rgba(37, 99, 235, 0.22); }
      .secondary-button { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
      .primary-button:hover, .secondary-button:hover, .list-button:hover, .pill-button:hover { transform: translateY(-1px); }
      .list-button, .pill-button { width: 100%; text-align: left; background: #f8fafc; color: #0f172a; border: 1px solid transparent; }
      .pill-button { display: inline-flex; width: auto; border-radius: 999px; }
      .search-input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid #cbd5e1; outline: none; }
      .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
      .content-split { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
      .panel-column { display: flex; flex-direction: column; gap: 18px; }
      .list-panel { display: flex; flex-direction: column; gap: 12px; }
      .topic-pill-group { display: flex; flex-wrap: wrap; gap: 10px; }
      .chapter-panel, .data-panel { margin-top: 20px; background: #f8fafc; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; }
      .chapter-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      .empty-state { color: #64748b; padding: 20px; border-radius: 18px; background: #f8fafc; }
      .search-panel { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 18px; }
      .json-editor { width: 100%; min-height: 360px; border-radius: 20px; border: 1px solid #cbd5e1; padding: 18px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #111827; }
      .canvas-shell { min-height: 360px; border-radius: 24px; overflow: hidden; background: #0f172a; display: grid; place-items: center; }
      .viz-canvas { width: 100%; height: 360px; display: block; }
      pre { margin: 0; background: #f8fafc; padding: 18px; border-radius: 20px; overflow: auto; font-size: 13px; line-height: 1.5; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      li { margin: 0; }
      .status-badge { min-width: 110px; text-align: center; }
      @media (max-width: 1080px) {
        .layout-grid { grid-template-columns: 1fr; }
        .content-split, .chapter-columns { grid-template-columns: 1fr; }
      }
    </style>
    <meta name="theme-color" content="#112240" />
    <link rel="icon" href="/favicon.ico" />
    <script defer src="/vendor-react.production.min.js"></script>
    <script defer src="/vendor-react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
